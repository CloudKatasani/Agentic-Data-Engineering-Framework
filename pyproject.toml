[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adef"
version = "1.0.0"
description = "Agentic Data Engineering Framework - approval-gated AI agent team for the data engineering lifecycle"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "anthropic>=2.0", "pyyaml>=6.0",
  "jsonschema>=4.22", "cryptography>=42", "pydantic>=2.7", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adef = "adef.cli:main"

[tool.setuptools.packages.find]
include = ["adef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

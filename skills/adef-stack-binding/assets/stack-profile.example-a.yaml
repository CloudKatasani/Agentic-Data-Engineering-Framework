# Example Stack Profile A - cloud data platform, SQL-first transformation
# Copy to runs/<run_id>/control/stack-profile.yaml and edit. No secrets in this file.
profile_id: example-a
profile_version: "1.0.0"
portability_required: false        # true = restrict designs to portable features

variables:                         # referenced as ${var} in generated code
  org_prefix: "acme"
  domain: "customer"

environments:
  dev:  { purpose: sandbox,    agent_max_class: A1, secrets_ref: "secrets/adef/dev" }
  test: { purpose: shared,     agent_max_class: A2, secrets_ref: "secrets/adef/test" }
  prod: { purpose: production, agent_max_class: A0, secrets_ref: "secrets/adef/prod" }
  # agent_max_class = highest action class an agent may take without a per-action approval.
  # prod is A0: agents observe only; all changes go through the release pipeline after G6b.

slots:
  cloud:              { tool: aws,        version: "n/a" }
  object_storage:     { tool: s3,         version: "n/a" }
  table_format:       { tool: iceberg,    version: "2" }
  compute_engine:     { tool: snowflake,  version: "current" }
  ingestion:          { tool: native-loader, version: "current" }
  transformation:     { tool: dbt-core,   version: "1" }
  orchestration:      { tool: airflow,    version: "2" }
  data_quality:       { tool: dbt-tests,  version: "1" }
  catalog_governance: { tool: collibra,   version: "current" }
  lineage:            { tool: catalog-native, version: "current" }
  virtualization:     { tool: none, reason: "single platform in scope" }
  semantic_layer:     { tool: platform-native, version: "current" }
  bi:                 { tool: power-bi,   version: "current" }
  ai_consumption:     { tool: platform-native, version: "current" }
  version_control:    { tool: github,     version: "n/a" }
  cicd:               { tool: github-actions, version: "n/a" }
  iac:                { tool: terraform,  version: "1" }
  secrets:            { tool: aws-secrets-manager, version: "n/a" }
  observability:      { tool: platform-native, version: "current" }
  itsm:               { tool: servicenow, version: "current" }
  approval_channel:   { tool: pull-request-and-ticket, version: "n/a" }

limits:
  max_compute_size: "S"
  auto_suspend_seconds: 60
  query_timeout_seconds: 120
  profiling_row_cap: 10000
  monthly_cost_cap: 0              # 0 = every paid action needs approval

standards:
  layers: [raw, conformed, curated, data_product]
  naming_case: upper_snake
  history_default: type-2
  timezone: UTC
  branch_strategy: trunk-with-feature-branches
  protected_branches: [main]

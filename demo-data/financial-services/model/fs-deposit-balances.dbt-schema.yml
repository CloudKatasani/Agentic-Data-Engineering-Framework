version: 2
models:
- name: dim_customer
  description: Bank customer
  meta:
    grain: one row per customer version
    history: type2
    owner: ''
  config:
    contract:
      enforced: true
  columns:
  - name: customer_id
    description: Business key
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - not_null
  - name: segment
    description: Mass, affluent or private
    meta:
      classification: internal
      business_rule: null
  - name: kyc_status
    description: VERIFIED, PENDING or EXPIRED
    meta:
      classification: internal
      business_rule: null
  - name: full_name
    description: Customer name (masked)
    meta:
      classification: restricted
      business_rule: null
    tags:
    - pii
    - restricted
- name: dim_product
  description: Deposit product
  meta:
    grain: one row per product
    history: type1
    owner: ''
  config:
    contract:
      enforced: true
  columns:
  - name: product_code
    description: Business key
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - unique
    - not_null
  - name: product_name
    description: Product name
    meta:
      classification: internal
      business_rule: null
  - name: product_type
    description: Current, savings or term
    meta:
      classification: internal
      business_rule: null
- name: dim_account
  description: Deposit account
  meta:
    grain: one row per account version
    history: type2
    owner: ''
  config:
    contract:
      enforced: true
  columns:
  - name: account_id
    description: Business key
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - not_null
  - name: customer_id
    description: Account holder
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - relationships:
        to: ref('dim_customer')
        field: customer_id
  - name: product_code
    description: Product
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - relationships:
        to: ref('dim_product')
        field: product_code
  - name: branch_code
    description: Servicing branch
    meta:
      classification: internal
      business_rule: null
  - name: status
    description: OPEN, DORMANT or CLOSED
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - accepted_values:
        values:
        - OPEN
        - DORMANT
        - CLOSED
  - name: currency
    description: ISO currency
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - accepted_values:
        values:
        - USD
        - EUR
        - GBP
- name: fct_daily_balance
  description: End-of-day deposit balance
  meta:
    grain: one row per account per business day
    history: none
    owner: ''
  config:
    contract:
      enforced: true
  columns:
  - name: daily_balance_id
    description: Business key
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - unique
    - not_null
  - name: account_id
    description: Account
    meta:
      classification: internal
      business_rule: null
    data_tests:
    - relationships:
        to: ref('dim_account')
        field: account_id
  - name: balance_date
    description: Business date
    meta:
      classification: internal
      business_rule: null
  - name: ledger_balance
    description: Ledger balance
    meta:
      classification: confidential
      business_rule: BR-001
  - name: available_balance
    description: Available balance
    meta:
      classification: confidential
      business_rule: null
